<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#010a02">
  <title>Play | Krypton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="play.css?v=2">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7642141732099289" crossorigin="anonymous"></script>
</head>
<body class="play-page">
  <div class="noise"></div>

  <header class="site-header">
    <span class="brand-center" aria-label="Krypton home">
      <img src="logo.png" alt="Krypton logo"><span>krypton</span>
    </span>
  </header>

  <nav class="main-nav" aria-label="Primary navigation">
    <a href="index.html">Home</a>
    <a href="game.html">Games</a>
    <a href="movies.html">Movies</a>
  </nav>

  <main class="player-container">
    <div class="ad-space ad-top">
      <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px" data-ad-client="ca-pub-7642141732099289" data-ad-slot="1234567890"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>

    <div class="player-main-row">
      <div class="ad-space ad-side">
        <ins class="adsbygoogle" style="display:inline-block;width:160px;height:600px" data-ad-client="ca-pub-7642141732099289" data-ad-slot="1234567890"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <div class="game-wrapper">
        <div class="game-header">
            <h1 id="game-title">Loading...</h1>
            <button id="fullscreen-btn" class="glow-button">Fullscreen <span>⛶</span></button>
        </div>
        <div class="iframe-container" id="iframe-container">
            <div id="loading-screen" class="loading-screen">
                <img src="logo.png" alt="Krypton Logo" class="loading-logo">
                <div class="loading-bar-container">
                    <div class="loading-bar"></div>
                </div>
            </div>
            <iframe id="game-iframe" src="" frameborder="0" allowfullscreen></iframe>
        </div>
      </div>

      <div class="ad-space ad-side">
        <ins class="adsbygoogle" style="display:inline-block;width:160px;height:600px" data-ad-client="ca-pub-1234567890123456" data-ad-slot="1234567890"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>

    <div class="ad-space ad-bottom">
      <ins class="adsbygoogle" style="display:inline-block;width:728px;height:90px" data-ad-client="ca-pub-1234567890123456" data-ad-slot="1234567890"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </main>

  <script src="play.js?v=2"></script>
  <script src="user-count.js?v=2"></script>
  <script src="ctx-menu.js?v=2"></script>
  <script src="site-gate.js?v=2"></script>
</body>
</html>
