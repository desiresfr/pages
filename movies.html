<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#010a02">
  <meta name="description" content="Watch movies on Krypton — your school entertainment hub.">
  <title>Movies | Krypton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
  <link rel="stylesheet" href="home.css?v=2">
  <link rel="stylesheet" href="folder.css?v=2">
</head>
<body class="movie-page">
  <div class="noise"></div>

  <header class="site-header">
    <span class="brand-center" aria-label="Krypton home">
      <img src="logo.png" alt="Krypton logo"><span>krypton</span>
    </span>
  </header>

  <nav class="main-nav" aria-label="Primary navigation">
    <a href="index.html">Home</a>
    <a href="game.html">Games</a>
    <a class="active" href="movies.html">Movies</a>
  </nav>

  <main class="game-landing">
    <div class="game-landing-bg"></div>
    <div class="game-landing-content">
      <p class="section-kicker"><span class="pulse-dot"></span> KRYPTON / MOVIE ROOM</p>
      <img src="logo.png" alt="" class="game-logo">
      <h1>Choose your<br><em>next movie.</em></h1>
      <p id="movie-count" class="game-count">Loading...</p>
    </div>

    <div class="continue-section" id="continue-section" style="display:none">
      <div class="continue-header">
        <span class="pulse-dot"></span>
        <span class="section-kicker">Continue Watching</span>
      </div>
      <div class="continue-row" id="continue-shelf"></div>
    </div>

    <div class="folder-grid" id="movie-shelf">
      <p class="empty-shelf">Loading movies...</p>
    </div>

    <div class="show-more-row">
      <button id="show-more-movies" class="show-more-btn" style="display:none">Show <span>0</span> more</button>
      <button id="show-all-movies" class="show-more-btn" style="display:none">Show all</button>
    </div>

    <a class="glow-button back-home" href="index.html">Back home <span>↗</span></a>
  </main>

  <footer>
    <span class="footer-brand">krypton<span>®</span></span>
    <span>Made for school breaks and curious minds.</span>
    <span class="footer-status"><i></i> Safe for school</span>
  </footer>

  <script src="movies.js?v=2"></script>
  <script src="ctx-menu.js?v=2"></script>
  <script src="site-gate.js?v=2"></script>
</body>
</html>
