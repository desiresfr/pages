<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020803">
  <meta name="description" content="Browse and launch games on Krypton — your school entertainment hub.">
  <title>Games | Krypton</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="folder.css">
</head>
<body class="game-page">
  <div class="noise"></div>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Krypton home">
      <img src="logo.png" alt="Krypton logo"><span>krypton</span>
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a class="active" href="game.html">Games</a>
    </nav>
    <label class="search-box">
      <span>⌕</span>
      <input type="search" placeholder="search games" aria-label="Search games">
    </label>
  </header>

  <main class="game-landing">
    <div class="game-landing-bg"></div>
    <div class="game-landing-content">
      <p class="section-kicker"><span class="pulse-dot"></span> KRYPTON / GAME ROOM</p>
      <img src="logo.png" alt="" class="game-logo">
      <h1>Choose your<br><em>next game.</em></h1>
      <p id="game-count" class="game-count">Scanning...</p>
    </div>

    <div class="folder-grid" id="game-shelf">
      <p class="empty-shelf">Scanning the Games folder...</p>
    </div>

    <a class="glow-button back-home" href="index.html">Back home <span>↗</span></a>
  </main>

  <footer>
    <span class="footer-brand">krypton<span>®</span></span>
    <span>Made for school breaks and curious minds.</span>
    <span class="footer-status"><i></i> Safe for school</span>
  </footer>

  <script src="game.js"></script>
</body>
</html>
